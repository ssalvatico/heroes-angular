<ng-template #divLoading>
  <div class="flex justify-content-center align-items-center" style="min-height: 50vh;">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
</ng-template>

@if (hero(); as h) {
  <div class="grid p-2">

    <mat-card class="m-3 col-12 sm:col-6 md:col-4">
      
      <mat-card-header class="mb-2">
        <mat-card-title class="text-3xl font-bold">{{ h.superhero }}</mat-card-title>
        <mat-card-subtitle>{{ h.alter_ego }}</mat-card-subtitle>
      </mat-card-header>
      
      <img 
        [src]="h | heroimage"
        [alt]="h.superhero"
        mat-card-image
      />
    </mat-card>

    <mat-card class="m-3 col-12 sm:col-6 md:col-4">
      <mat-card-header>
        <mat-card-title class="font-bold">Información</mat-card-title>
      </mat-card-header>

      <mat-card-content class="pt-3">
        <mat-list>
          <mat-list-item>
            <span matListItemTitle class="text-sm font-bold">Editorial:</span>
            <span matListItemLine>{{ h.publisher }}</span>
          </mat-list-item>

          <mat-list-item>
            <span matListItemTitle class="text-sm font-bold">Primera aparición:</span>
            <span matListItemLine>{{ h.first_appearance }}</span>
          </mat-list-item>

          <mat-list-item>
            <span matListItemTitle class="text-sm font-bold pb-2">Personajes:</span>
            <mat-chip-set matListItemLine>
              @for (c of h.characters.split(','); track $index) {
                <mat-chip>{{ c.trim() }}</mat-chip>
              }
            </mat-chip-set>
          </mat-list-item>
        </mat-list>
      </mat-card-content>

      <mat-card-actions align="start">
        <button mat-button (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Volver
        </button>
      </mat-card-actions>
    </mat-card>

  </div>
} @else {
  <ng-container *ngTemplateOutlet="divLoading"></ng-container>
}
